name: Verify Windows application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - name: Browser tests
        id: browser_tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright-results.json
        run: npm run test:e2e -- --reporter=line,json
      - name: Annotate browser test failures
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        run: node scripts/report-playwright-failures.mjs test-results/playwright-results.json
      - name: Upload browser test failure artifacts
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results/
          if-no-files-found: warn
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: news-terminal-windows-unsigned
          path: |
            src-tauri/target/release/news-terminal.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
