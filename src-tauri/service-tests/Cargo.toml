[package]
name="news-terminal-service-tests"
version="0.1.0"
edition="2021"
[lib]
path="harness.rs"
[dependencies]
base64="0.22"
serde_json="1"
reqwest={version="0.12",default-features=false,features=["rustls-tls","json","stream"]}
feed-rs="2"
futures-util="0.3"
url="2"
sha2="0.10"
keyring={version="3",features=["windows-native"]}
html-escape="0.2"
chrono="0.4"
tokio={version="1",features=["time","sync","net","macros","rt-multi-thread"]}
