# Headless core regression harness for isolating native-integration build errors.
# Production uses ../Cargo.toml with normal Tauri dependencies, no desktop bypass.
[package]
name="news-terminal-core-tests"
version="0.1.0"
edition="2021"
[lib]
name="news_terminal_lib"
path="lib.rs"
[[test]]
name="backend"
path="../tests/backend.rs"
[dependencies]
base64="0.22"
chrono="0.4"
reqwest={version="0.12",default-features=false,features=["rustls-tls","json","stream"]}
feed-rs="2"
futures-util="0.3"
keyring={version="3",features=["windows-native"]}
html-escape="0.2"
tokio={version="1",features=["time","sync","net","macros","rt-multi-thread"]}
serde_json="1"
rusqlite={version="0.37",features=["bundled","backup"]}
sha2="0.10"
url="2"
uuid={version="1",features=["v4"]}
[dev-dependencies]
tempfile="3"
